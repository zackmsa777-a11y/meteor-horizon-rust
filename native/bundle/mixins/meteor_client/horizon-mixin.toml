[mod]
id = "meteor_client"
version = "0.1.0-migration.4"
priority = 100

[compatibility]
horizon_revision = "b76ae35f5b9b2d82c0e6818fc0ef93bb5277ec73"

[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "meteor_client_migration"
source = "runtime.rs"

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "zoom"
hook = "zoom"
hook_version = 1
kind = "HEAD"
helper = "zoom.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "zoom" },
]

[[injection]]
id = "wheel"
hook = "wheel"
hook_version = 1
kind = "HEAD"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
