# Source Tick.Pre: named tick runs after movement and cannot substitute for this boundary.
[[injection]]
id = "movement_pre"
target = "horizon_client::game::Game<'_>::tick"
kind = "HEAD"
helper = "movement_pre.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Keyboard Press/Release names; the stable wrapper discards keyboard Repeat events.
[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# HighJump production modules and two concrete cancellable HEAD hooks.
[[module]]
id = "highjump_motion"
file = "crates/horizon-client/src/motion.rs"
name = "meteor_highjump"
source = "motion_highjump.rs"
visibility = "pub"

[[module]]
id = "highjump_publisher"
file = "crates/horizon-client/src/game.rs"
name = "meteor_highjump_publisher"
source = "game_highjump_publisher.rs"

[[injection]]
id = "highjump_block"
target = "horizon_client::motion::<MotionWorld<'_,'_,'_> as LivingMotionWorld>::block_jump_factor"
kind = "HEAD"
cancellable = true
helper = "highjump_block_head.rs"
bindings = [{name="world",ty="&mut crate::motion::MotionWorld<'_, '_, '_>",value="&mut *self"}]

[[injection]]
id = "highjump_jump"
target = "horizon_client::motion::MotionWorld<'_,'_,'_>::jump_from_ground"
kind = "HEAD"
cancellable = true
helper = "highjump_jump_head.rs"
bindings = [{name="world",ty="&mut crate::motion::MotionWorld<'_, '_, '_>",value="&mut *self"}]

# BreakDelay: mouse presses and the window client's block-breaking boundary.
[[injection]]
id = "break_window_mouse"
target = "horizon_client::game::<Game<'_> as ApplicationHandler>::window_event"
kind = "HEAD"
helper = "break_window_mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "event", ty = "&winit::event::WindowEvent", value = "&event" },
]

[[injection]]
id = "break_control_mouse"
target = "horizon_client::game::Game<'_>::play_mouse"
kind = "HEAD"
helper = "break_control_mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[module]]
id = "break_remote_state"
file = "crates/horizon-client/src/game/remote.rs"
name = "meteor_break_remote"
source = "game_remote_break.rs"

[[injection]]
id = "break_remote_mining"
target = "horizon_client::game::remote::Game<'_>::remote_mining"
kind = "HEAD"
helper = "break_remote_mining.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "start", ty = "bool", value = "start" },
]

